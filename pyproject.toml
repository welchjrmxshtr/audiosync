[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiosync"
version = "1.0.1"
description = "Sample-locked audio between machines on a local network"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
    "zeroconf>=0.100",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
audiosync = "audiosync.__main__:main"

[tool.setuptools.packages.find]
include = ["audiosync*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
