name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint tooling
        run: python -m pip install "ruff>=0.6"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Ruff
        run: ruff check .
      - name: Package editable install
        run: python -m pip install --no-deps -e .
      - name: Console entry point
        run: audiosync --version
      - name: Shell syntax
        run: bash -n install.sh scripts/setup-smb-mount.sh
