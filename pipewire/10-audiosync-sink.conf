# audiosync: a sink that every application can render into, whose monitor
# the capture path feeds to snapserver.  Lingers so it survives the app
# closing; kept in the user's config so install/uninstall is a file removal.
context.objects = [
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "audiosync_sink"
            node.description        = "Audiosync"
            media.class             = "Audio/Sink"
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
            object.linger           = true
            adapter.auto-port-config = {
                mode     = dsp
                monitor  = true
                position = preserve
            }
        }
    }
]
